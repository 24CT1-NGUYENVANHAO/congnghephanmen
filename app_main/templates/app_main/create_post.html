{% extends 'app_main/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border mt-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Đăng tin thanh lý / Tặng đồ</h2>

    <!-- BẮT BUỘC: Thêm enctype="multipart/form-data" để tải được file ảnh -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Tiêu đề -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tiêu đề</label>
            {{ form.title }}
        </div>

        <!-- Danh mục & Tình trạng -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Danh mục</label>
                <!-- Render ô chọn danh mục động từ CSDL -->
                {{ form.category }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tình trạng</label>
                {{ form.condition }}
            </div>
        </div>

        <!-- Giá bán -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Giá bán (VNĐ)</label>
            {{ form.price }}
        </div>

        <!-- Ảnh sản phẩm tải lên -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Ảnh sản phẩm</label>
            <!-- ĐÃ ĐỔI: form.image_url thành form.image -->
            {{ form.image }}
        </div>

        <!-- Mô tả chi tiết -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Mô tả chi tiết</label>
            {{ form.description }}
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
            Đăng tin ngay
        </button>
    </form>
</div>
{% endblock %}
