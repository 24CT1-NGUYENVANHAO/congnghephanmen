{% extends 'app_main/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border mt-8">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Đăng nhập SáchGócUni</h2>

    {% if form.errors %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4">
            Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>
    {% endif %}

    <form method="post" autocomplete="off">
        {% csrf_token %}
        
        <!-- Thêm thuộc tính autocomplete="new-password" cho ô đăng nhập -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Tên đăng nhập / Email</label>
            <input type="text" name="username" autocomplete="off" required class="w-full p-3 border rounded-xl">
        </div>
    
        <!-- Thêm thuộc tính autocomplete="new-password" cho ô mật khẩu -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Mật khẩu</label>
            <input type="password" name="password" autocomplete="new-password" required class="w-full p-3 border rounded-xl">
        </div>
    
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Đăng nhập</button>
    </form>
</div>
{% endblock %}
