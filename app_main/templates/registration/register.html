{% extends 'app_main/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border mt-8">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Đăng ký tài khoản Sinh viên</h2>
    
    {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm mb-4">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" class="space-y-4" autocomplete="off">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tên đăng nhập</label>
            <input type="text" name="username" required autocomplete="off"
                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
            <input type="password" name="password1" required autocomplete="new-password" placeholder="Ví dụ: Abc12345"
                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Xác nhận mật khẩu</label>
            <input type="password" name="password2" required autocomplete="new-password"
                   class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold hover:bg-blue-700 transition">
            Tạo tài khoản
        </button>
    </form>
</div>
{% endblock %}
