{% load static app_extras %}<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SáchGóc Uni - Sàn giao dịch và chia sẻ đồ dùng, giáo trình cho sinh viên. Mua bán, tặng 0đ, trao đổi an toàn.">
    <meta name="theme-color" content="#4f46e5">
    <title>{% block title %}SáchGóc Uni — Sàn Giao Dịch Sinh Viên{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">

</head>
<body class="min-h-screen flex flex-col" style="background:var(--slate-50)">

<main class="flex-1 w-full">
    {% block content %}{% endblock %}

{% include 'partials/footer.html' %}

<script src="{% static 'js/main.js' %}"></script>
{% block scripts %}{% endblock %}
