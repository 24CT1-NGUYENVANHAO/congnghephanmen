{% load static app_extras %}<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SáchGóc Uni - Sàn giao dịch và chia sẻ đồ dùng, giáo trình cho sinh viên. Mua bán, tặng 0đ, trao đổi an toàn.">
    <meta name="theme-color" content="#4f46e5">
    <title>{% block title %}SáchGóc Uni — Sàn Giao Dịch Sinh Viên{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Tailwind CSS được lưu CỤC BỘ (static/js/tailwind.min.js) nên dự án
      vẫn chạy đầy đủ khi KHÔNG có mạng / khi thầy giáo chấm offline.
      main.css đặt sau để ghi đè component dùng chung (.btn, .card, .badge...).
    -->
    <script src="{% static 'js/tailwind.min.js' %}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc',
                            400:'#818cf8', 500:'#6366f1', 600:'#4f46e5',
                            700:'#4338ca', 800:'#3730a3', 900:'#312e81'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body class="min-h-screen flex flex-col" style="background:var(--slate-50)">

{% include 'partials/navbar.html' %}

<!-- Thông báo từ hệ thống -->
{% include 'partials/messages.html' %}

<main class="flex-1 w-full">
    {% block content %}{% endblock %}
</main>

{% include 'partials/footer.html' %}

<script src="{% static 'js/main.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
